<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Seguro - VM Tecnología</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://js.openpay.mx/openpay.v1.min.js"></script>
  <script src="https://js.openpay.mx/openpay-data.v1.min.js"></script>
</head>
<body style="background:#f5f5f5; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; font-family:Arial, sans-serif;">

<div style="max-width:460px; width:100%; margin:auto; padding:24px; border:1px solid #ddd; border-radius:12px; background:#fff;">

  <div style="text-align:center; margin-bottom:20px;">
    <h3 style="color:#004481; margin:0 0 6px;">🔒 Pago Seguro</h3>
    <p style="font-size:13px; color:#666; margin:0 0 8px;">Procesado por</p>
    <div style="display:inline-flex; align-items:center; padding:5px 14px; border:2px solid #ddd; border-radius:8px; background:white;">
      <img src="https://raw.githubusercontent.com/betoesses1/Formulario-Pago/main/LogotipoOpenpay-01.jpg" style="height:22px; width:auto;" alt="Openpay">
    </div>
  </div>

  <div style="display:flex; justify-content:center; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; padding:10px; background:#f9f9f9; border-radius:8px;">
    <span style="font-size:11px; color:#888; width:100%; text-align:center; margin-bottom:6px;">Métodos de pago aceptados:</span>
    <div style="background:white; border:1px solid #e5e7eb; border-radius:6px; width:64px; height:40px; display:flex; align-items:center; justify-content:center; padding:4px;">
      <img src="https://raw.githubusercontent.com/betoesses1/Formulario-Pago/main/visa.png" style="max-height:28px; max-width:56px; object-fit:contain;" alt="Visa">
    </div>
    <div style="background:white; border:1px solid #e5e7eb; border-radius:6px; width:64px; height:40px; display:flex; align-items:center; justify-content:center; padding:4px;">
      <img src="https://raw.githubusercontent.com/betoesses1/Formulario-Pago/main/masterCard.png" style="max-height:28px; max-width:56px; object-fit:contain;" alt="Mastercard">
    </div>
    <div style="background:white; border:1px solid #e5e7eb; border-radius:6px; width:64px; height:40px; display:flex; align-items:center; justify-content:center; padding:4px;">
      <img src="https://raw.githubusercontent.com/betoesses1/Formulario-Pago/main/americanExpress.png" style="max-height:28px; max-width:56px; object-fit:contain;" alt="American Express">
    </div>
    <div style="background:white; border:1px solid #e5e7eb; border-radius:6px; width:64px; height:40px; display:flex; align-items:center; justify-content:center; padding:4px;">
      <img src="https://raw.githubusercontent.com/betoesses1/Formulario-Pago/main/carnet.png" style="max-height:28px; max-width:56px; object-fit:contain;" alt="Carnet">
    </div>
    <div style="background:white; border:1px solid #e5e7eb; border-radius:6px; width:64px; height:40px; display:flex; align-items:center; justify-content:center; padding:4px;">
      <img src="https://raw.githubusercontent.com/betoesses1/Formulario-Pago/main/spei.png" style="max-height:28px; max-width:56px; object-fit:contain;" alt="SPEI">
    </div>
  </div>

  <!-- Info del pedido -->
  <div id="order-info" style="background:#f0f7ff; border:1px solid #b3d7f0; border-radius:8px; padding:12px 16px; margin-bottom:18px; font-size:14px; color:#004481;">
    <div id="order-desc" style="font-weight:bold; margin-bottom:4px;">Cargando pedido...</div>
    <div id="order-amount" style="font-size:20px; font-weight:900;"></div>
  </div>

  <!-- ============ TABS de método ============ -->
  <div style="display:flex; gap:8px; margin-bottom:16px;">
    <button type="button" id="tab-card"  onclick="mostrarMetodo('card')"  style="flex:1; padding:10px; border:1px solid #004481; background:#004481; color:#fff; border-radius:8px; font-weight:bold; font-size:13px; cursor:pointer;">Tarjeta</button>
    <button type="button" id="tab-spei"  onclick="mostrarMetodo('spei')"  style="flex:1; padding:10px; border:1px solid #ccc; background:#fff; color:#333; border-radius:8px; font-weight:bold; font-size:13px; cursor:pointer;">SPEI</button>
    <button type="button" id="tab-cash"  onclick="mostrarMetodo('cash')"  style="flex:1; padding:10px; border:1px solid #ccc; background:#fff; color:#333; border-radius:8px; font-weight:bold; font-size:13px; cursor:pointer;">Efectivo</button>
  </div>

  <!-- ============ PANEL TARJETA (tu flujo original) ============ -->
  <div id="panel-card">
  <form id="payment-form">
    <input type="hidden" name="token_id" id="token_id">
    <input type="hidden" name="device_session_id" id="device_session_id">

    <div style="margin-bottom:12px;">
      <label style="font-size:13px; font-weight:bold; color:#333;">Nombre del titular</label><br>
      <input type="text" data-openpay-card="holder_name" style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-top:4px;" placeholder="Como aparece en la tarjeta">
    </div>

    <div style="margin-bottom:12px;">
      <label style="font-size:13px; font-weight:bold; color:#333;">Número de tarjeta</label><br>
      <input type="text" data-openpay-card="card_number" style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-top:4px;" placeholder="1234 5678 9012 3456" maxlength="16">
    </div>

    <div style="display:flex; gap:10px; margin-bottom:12px;">
      <div style="flex:1;">
        <label style="font-size:13px; font-weight:bold; color:#333;">Mes</label><br>
        <input type="text" data-openpay-card="expiration_month" placeholder="MM" maxlength="2" style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-top:4px;">
      </div>
      <div style="flex:1;">
        <label style="font-size:13px; font-weight:bold; color:#333;">Año</label><br>
        <input type="text" data-openpay-card="expiration_year" placeholder="AA" maxlength="2" style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-top:4px;">
      </div>
      <div style="flex:1;">
        <label style="font-size:13px; font-weight:bold; color:#333;">CVV</label><br>
        <input type="text" data-openpay-card="cvv2" placeholder="123" maxlength="4" style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-top:4px;">
      </div>
    </div>

    <div style="background:#e8f4fd; border:1px solid #b3d7f0; border-radius:6px; padding:10px; margin-bottom:14px; font-size:12px; color:#004481; display:flex; align-items:center; gap:8px;">
      🔐 <span>Tu banco verificará esta compra con <strong>3D Secure</strong> para mayor seguridad.</span>
    </div>

    <div id="error-msg" style="display:none; background:#fff0f0; border:1px solid #ffcccc; color:#cc0000; border-radius:6px; padding:10px; margin-bottom:12px; font-size:13px;"></div>

    <button type="submit" id="pay-button" style="width:100%; background:#004481; color:white; padding:14px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; font-size:16px;">
      🔒 PAGAR AHORA
    </button>
  </form>
  </div>

  <!-- ============ PANEL SPEI / EFECTIVO ============ -->
  <div id="panel-alt" style="display:none;">
    <div style="margin-bottom:12px;">
      <label style="font-size:13px; font-weight:bold; color:#333;">Nombre completo</label><br>
      <input type="text" id="alt-name" style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-top:4px;" placeholder="Nombre y apellido">
    </div>
    <div style="margin-bottom:12px;">
      <label style="font-size:13px; font-weight:bold; color:#333;">Correo electrónico</label><br>
      <input type="email" id="alt-email" style="width:100%; padding:10px; box-sizing:border-box; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-top:4px;" placeholder="correo@ejemplo.com">
    </div>

    <div id="alt-error" style="display:none; background:#fff0f0; border:1px solid #ffcccc; color:#cc0000; border-radius:6px; padding:10px; margin-bottom:12px; font-size:13px;"></div>

    <button type="button" id="alt-button" onclick="generarReferencia()" style="width:100%; background:#004481; color:white; padding:14px; border:none; border-radius:6px; cursor:pointer; font-weight:bold; font-size:16px;">
      Generar referencia de pago
    </button>

    <!-- Resultado -->
    <div id="alt-result" style="display:none; margin-top:18px; border-top:1px solid #eee; padding-top:16px;"></div>
  </div>

  <div style="text-align:center; margin-top:16px; font-size:11px; color:#999;">
    <p style="margin:4px 0;">🔒 Conexión segura SSL · Tus datos están protegidos</p>
    <p style="margin:4px 0;">Al pagar aceptas nuestros <a href="https://www.tiendasvm.com.mx/inicio/términos-condiciones-y-privacidad" style="color:#004481;">Términos y Condiciones</a></p>
  </div>
</div>

<script type="text/javascript">
  // ⚙️ Backend: las funciones viven en el Netlify de pagos (plural)
  const API_BASE = "https://pagos.tiendasvm.com.mx";

  // Leer parámetros de la URL
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get('order_id');
  const amount = params.get('amount');
  const description = params.get('description') || 'Pedido Tiendas VM';

  document.getElementById('order-desc').textContent = description;
  document.getElementById('order-amount').textContent = amount ? '$' + parseFloat(amount).toFixed(2) + ' MXN' : '';

  // ---- Cambio de método (tabs) ----
  let metodoAlt = null; // 'bank_account' o 'store'
  function mostrarMetodo(m){
    const tabs = {card:'tab-card', spei:'tab-spei', cash:'tab-cash'};
    Object.values(tabs).forEach(id=>{
      const b=document.getElementById(id);
      b.style.background='#fff'; b.style.color='#333'; b.style.borderColor='#ccc';
    });
    const activo=document.getElementById(tabs[m]);
    activo.style.background='#004481'; activo.style.color='#fff'; activo.style.borderColor='#004481';

    document.getElementById('panel-card').style.display = (m==='card')?'block':'none';
    document.getElementById('panel-alt').style.display  = (m==='card')?'none':'block';
    document.getElementById('alt-result').style.display = 'none';
    document.getElementById('alt-error').style.display  = 'none';

    if(m==='spei'){ metodoAlt='bank_account'; document.getElementById('alt-button').textContent='Generar CLABE para transferir'; }
    if(m==='cash'){ metodoAlt='store'; document.getElementById('alt-button').textContent='Generar referencia de efectivo'; }
  }

  // ---- Generar referencia SPEI / efectivo ----
  function generarReferencia(){
    const err = document.getElementById('alt-error');
    const result = document.getElementById('alt-result');
    err.style.display='none'; result.style.display='none';

    const name = document.getElementById('alt-name').value.trim();
    const email = document.getElementById('alt-email').value.trim();
    if(!amount || parseFloat(amount)<=0){ return mostrarErr('Este enlace no trae un monto válido.'); }
    if(!name || !email){ return mostrarErr('Escribe tu nombre y correo.'); }

    const btn = document.getElementById('alt-button');
    btn.disabled=true; const txtOrig=btn.textContent; btn.textContent='⏳ Generando...';

    fetch(API_BASE + '/.netlify/functions/openpay-create-charge', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ method:metodoAlt, amount:amount, order_id:orderId, description:description, name:name, email:email })
    })
    .then(r=>r.json())
    .then(d=>{
      if(!d.ok){ throw new Error(d.error || 'No se pudo generar la referencia.'); }
      pintarResultado(d);
    })
    .catch(e=> mostrarErr(e.message))
    .finally(()=>{ btn.disabled=false; btn.textContent=txtOrig; });
  }

  function mostrarErr(msg){ const e=document.getElementById('alt-error'); e.innerHTML='⚠️ '+msg; e.style.display='block'; }

  function fila(k,v){
    return '<div style="display:flex; justify-content:space-between; align-items:center; gap:10px; background:#f7f9fc; border:1px solid #e5e7eb; border-radius:8px; padding:10px 12px; margin-bottom:8px;">'
      + '<div><div style="font-size:11px; color:#888; text-transform:uppercase; letter-spacing:.04em;">'+k+'</div>'
      + '<div style="font-size:15px; font-weight:bold; color:#222; word-break:break-all;">'+v+'</div></div>'
      + '<button onclick="copiar(\''+String(v).replace(/'/g,"")+'\',this)" style="font-size:11px; font-weight:bold; color:#004481; background:#fff; border:1px solid #004481; border-radius:6px; padding:6px 10px; cursor:pointer;">Copiar</button></div>';
  }

  function pintarResultado(d){
    const result = document.getElementById('alt-result');
    const vence = d.due_date ? new Date(d.due_date).toLocaleDateString('es-MX',{day:'2-digit',month:'long',year:'numeric'}) : '—';
    let html='';
    if(d.method==='bank_account'){
      html += '<div style="font-weight:bold; color:#004481; font-size:16px; margin-bottom:4px;">Recibo de pago · Transferencia SPEI</div>';
      html += '<div style="font-size:12px; color:#666; margin-bottom:12px;">Beneficiario: <b>VM Tecnología &amp; Accesorios</b> · Vigencia: <b>'+vence+'</b></div>';
      html += fila('Monto exacto a pagar', '$'+Number(d.amount).toFixed(2)+' MXN');
      if(d.bank)  html += fila('Banco destino', d.bank);
      if(d.clabe) html += fila('CLABE', d.clabe);
      if(d.agreement) html += fila('Convenio CIE', d.agreement);

      html += '<div style="border:1px solid #e5e7eb; border-radius:8px; padding:12px; margin-top:10px;">';
      html += '<div style="font-weight:bold; color:#004481; font-size:13px; margin-bottom:6px;">Pasos para realizar el pago</div>';
      html += '<div style="font-size:12px; color:#333; margin-bottom:10px; line-height:1.6;"><b>Desde BBVA Bancomer:</b><br>1. En el menú "Pagar", elige "De servicios".<br>2. Ingresa el <b>Convenio CIE</b>: '+(d.agreement||'—')+'<br>3. En referencia, escribe la CLABE o el dato que pida.<br>4. Captura el <b>monto exacto</b> y confirma.</div>';
      html += '<div style="font-size:12px; color:#333; line-height:1.6;"><b>Desde cualquier otro banco:</b><br>1. Entra a "Transferencias / SPEI a otros bancos".<br>2. Agrega la <b>CLABE</b>: '+(d.clabe||'—')+'<br>3. Banco destino: '+(d.bank||'—')+'<br>4. Transfiere el <b>monto exacto</b>. Se acredita en minutos.</div>';
      html += '</div>';

      html += '<div style="background:#fff8e6; border:1px solid #ffe0a3; border-radius:6px; padding:10px; font-size:12px; color:#8a6d00; margin-top:10px;">⚠️ Transfiere el <b>monto exacto</b> ($'+Number(d.amount).toFixed(2)+'). Un monto distinto puede no acreditarse automáticamente.</div>';
      if(d.spei_pdf) html += '<div style="text-align:center; margin-top:12px;"><a href="'+d.spei_pdf+'" target="_blank" style="display:inline-block; background:#004481; color:#fff; padding:10px 18px; border-radius:6px; font-weight:bold; font-size:13px; text-decoration:none;">⬇ Descargar recibo oficial (PDF)</a></div>';
    } else {
      html += '<div style="font-weight:bold; color:#004481; font-size:16px; margin-bottom:4px;">Recibo de pago · Efectivo (PayNet)</div>';
      html += '<div style="font-size:12px; color:#666; margin-bottom:12px;">Beneficiario: <b>VM Tecnología &amp; Accesorios</b> · Vigencia: <b>'+vence+'</b></div>';
      html += fila('Total a pagar', '$'+Number(d.amount).toFixed(2)+' MXN');
      if(d.reference) html += fila('Referencia', d.reference);
      if(d.barcode_url) html += '<div style="text-align:center; margin:10px 0;"><img src="'+d.barcode_url+'" alt="Código de barras" style="max-width:100%; background:#fff; padding:10px; border:1px solid #e5e7eb; border-radius:8px;"><div style="font-size:11px; color:#888; margin-top:4px;">Si el escáner no lee el código, dicta la referencia al cajero.</div></div>';

      html += '<div style="border:1px solid #e5e7eb; border-radius:8px; padding:12px; margin-top:6px;">';
      html += '<div style="font-weight:bold; color:#004481; font-size:13px; margin-bottom:6px;">Cómo realizar el pago</div>';
      html += '<div style="font-size:12px; color:#333; line-height:1.7;">1. Acude a cualquier tienda afiliada a la red <b>PayNet</b>.<br>2. Indica al cajero que harás un <b>pago de servicio PayNet</b>.<br>3. Muestra el código de barras o dicta la referencia.<br>4. Paga en efectivo el monto total.<br>5. <b>Conserva tu ticket</b> como comprobante.</div>';
      html += '</div>';

      html += '<div style="background:#f7f9fc; border:1px solid #e5e7eb; border-radius:8px; padding:12px 10px; margin-top:10px; text-align:center;">'
        + '<div style="font-size:11px; color:#888; margin-bottom:8px;">Pago en efectivo a través de la red</div>'
        + '<div style="margin-bottom:10px;"><img src="https://raw.githubusercontent.com/betoesses1/Formulario-Pago/main/paynet.png" alt="PayNet by Openpay" style="height:40px; object-fit:contain;" onerror="this.style.display=\'none\';"></div>'
        + '<div style="font-size:11px; color:#888; margin-bottom:8px;">Disponible en:</div>'
        + '<div style="display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px;">'
        + logoTienda('7eleven.jpg','7-Eleven')
        + logoTienda('bodegaAurrera.jpg','Bodega Aurrerá')
        + logoTienda('circlek.jpg','Circle K')
        + logoTienda('farmaciaAhorro.jpg','Farmacias del Ahorro')
        + logoTienda('walmart.jpg','Walmart')
        + '</div>'
        + '<div style="font-size:11px; color:#888; margin-top:8px;">Consulta todos los puntos en <a href="https://www.paynet.com.mx/" target="_blank" style="color:#004481;">paynet.com.mx</a></div>'
        + '</div>';
      html += '<div style="background:#fff8e6; border:1px solid #ffe0a3; border-radius:6px; padding:10px; font-size:12px; color:#8a6d00; margin-top:10px;">⚠️ El pago en efectivo puede tener un monto máximo por operación y una comisión de la tienda. Válido hasta el <b>'+vence+'</b>.</div>';
      datosEfectivo = { amount:d.amount, reference:d.reference||'', barcode_url:d.barcode_url||'', vence:vence, desc:description, order:orderId||'' };
      html += '<div style="text-align:center; margin-top:12px;"><button type="button" onclick="descargarComprobanteEfectivo()" style="display:inline-block; background:#004481; color:#fff; padding:10px 18px; border:none; border-radius:6px; font-weight:bold; font-size:13px; cursor:pointer;">⬇ Descargar comprobante (PDF)</button></div>';
    }
    result.innerHTML = html; result.style.display='block';
  }

  function copiar(txt,btn){ navigator.clipboard.writeText(txt).then(()=>{ const o=btn.textContent; btn.textContent='✓'; setTimeout(()=>btn.textContent=o,1200); }); }

  // ---- Logo de tienda afiliada (desde GitHub; si falta la imagen, muestra el nombre) ----
  function logoTienda(archivo, nombre){
    const base = 'https://raw.githubusercontent.com/betoesses1/Formulario-Pago/main/';
    return '<div style="background:#fff; border:1px solid #e5e7eb; border-radius:6px; width:74px; height:44px; display:flex; align-items:center; justify-content:center; padding:5px;">'
      + '<img src="'+base+archivo+'" alt="'+nombre+'" title="'+nombre+'" style="max-width:100%; max-height:100%; object-fit:contain;" '
      + 'onerror="this.style.display=\'none\'; this.parentNode.innerHTML=\'<span style=&quot;font-size:9px;color:#666;text-align:center;&quot;>'+nombre+'</span>\';"></div>';
  }

  // ---- Comprobante descargable de EFECTIVO (lo genera la propia página) ----
  let datosEfectivo = null;
  function descargarComprobanteEfectivo(){
    if(!datosEfectivo){ return; }
    const d = datosEfectivo;
    const w = window.open('', '_blank');
    if(!w){ alert('Permite las ventanas emergentes para descargar el comprobante.'); return; }
    const html = ''
      + '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Comprobante de pago en efectivo</title>'
      + '<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif;} body{padding:28px;color:#222;}'
      + '.hdr{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #004481;padding-bottom:14px;margin-bottom:18px;}'
      + '.hdr h1{color:#004481;font-size:20px;} .hdr .r{text-align:right;font-size:12px;color:#666;}'
      + '.tot{background:#004481;color:#fff;border-radius:8px;padding:16px 20px;text-align:center;margin:16px 0;}'
      + '.tot .l{font-size:12px;opacity:.85;} .tot .v{font-size:30px;font-weight:900;}'
      + '.row{display:flex;justify-content:space-between;border:1px solid #e5e7eb;border-radius:8px;padding:10px 14px;margin-bottom:8px;font-size:14px;}'
      + '.row b{color:#004481;} .bc{text-align:center;margin:16px 0;} .bc img{max-width:100%;}'
      + '.steps{border:1px solid #e5e7eb;border-radius:8px;padding:14px;font-size:12.5px;line-height:1.8;}'
      + '.steps h3{color:#004481;font-size:14px;margin-bottom:6px;} .foot{margin-top:20px;font-size:11px;color:#777;text-align:center;border-top:1px solid #eee;padding-top:12px;}'
      + '@media print{.noprint{display:none;}}</style></head><body>'
      + '<div class="hdr"><div><h1>Comprobante de pago en efectivo</h1><div style="font-size:12px;color:#666;margin-top:4px;">VM Tecnología &amp; Accesorios</div></div>'
      + '<div class="r">Pedido: '+ (d.order||'—') +'<br>Concepto: '+ d.desc +'<br>Vigencia: <b>'+ d.vence +'</b></div></div>'
      + '<div class="tot"><div class="l">Total a pagar / MXN</div><div class="v">$'+ Number(d.amount).toFixed(2) +'</div></div>'
      + '<div class="row"><span>Referencia</span><b>'+ d.reference +'</b></div>'
      + (d.barcode_url ? '<div class="bc"><img src="'+ d.barcode_url +'" alt="Código de barras"><div style="font-size:11px;color:#888;">Si el escáner no lee el código, dicta la referencia al cajero.</div></div>' : '')
      + '<div class="steps"><h3>Cómo realizar el pago</h3>'
      + '1. Acude a una tienda afiliada a la red <b>PayNet</b> (OXXO, 7-Eleven, farmacias, Walmart y más).<br>'
